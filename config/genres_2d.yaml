# Titles that are ordinary English words: only accepted when the YouTube title STARTS with them.
ambiguous_titles: [Inside, Limbo, Braid, Grime, Gris, Islets, Unravel, Afterimage, Indivisible,
                   Sundered, Kunai, Constance, Mandragora, Contra, Jamestown, Biomorph, Noita]

# Titles that count as ONE game for grouping and the unseen-game holdout (editions, DLC, series
# with near-identical mechanics). Keys/values are titles; matching is normalized.
game_groups:
  "The Binding of Isaac": ["The Binding of Isaac: Rebirth", "The Binding of Isaac: Repentance"]
  Touhou: ["Embodiment of Scarlet Devil", "Perfect Cherry Blossom", "Imperishable Night", "Mountain of Faith",
           "Subterranean Animism", "Undefined Fantastic Object", "Ten Desires", "Double Dealing Character",
           "Legacy of Lunatic Kingdom", "Hidden Star in Four Seasons", "Wily Beast and Weakest Creature",
           "Unconnected Marketeers", "Fairy Wars", "Shoot the Bullet", "Violet Detector", "Phantasmagoria of Flower View"]
  "Hotline Miami": ["Hotline Miami 2", "Hotline Miami 2: Wrong Number"]
  "Ori and the Blind Forest": []
  "Blasphemous": []

# NitroGen `game` values that are YouTube chapter / stream markers rather than games. Matching videos
# are treated like game == "other" (identified per video). Python regexes, matched case-insensitively.
junk_slugs:
  - "^_*untitled"
  - "chapter|capitulo|cap_tulo|kapitel"
  - "inscreva|subscribe|deixa_o_like|like_and"
  - "^just_chatting|^chatting|^talking"
  - "^gameplay|^intro$|^outro$|^setup$|^controls$|^start$|^start_of|^starting|^stream|^twitch_plays$|^vod"
  - "^game_?\\d+$|^part_?\\d+$|^level_?\\d+$|^episode"
  - "^retro$|^special_events$|^games___demos$|^games$|^misc"
  - "mic_is_on|unmuted|muted_section|matches_start|gameplay_starts|in_cio_do_jogo|início"
  - "pc_specs|tier_list|stream_time_marker"
