# Abbreviations / alternate names seen in YouTube titles -> canonical title (must exist in games_2d
# or exclude_3d). Aliases are matched as whole words, even when short.
aliases:
  Castlevania Symphony of the Night: [sotn, symphony of the night]
  The Binding of Isaac: [isaac repentance, binding of isaac, tboi, isaac rebirth, isaac afterbirth]
  Celeste: [strawberry jam collab]
  Hollow Knight: [pantheon of hallownest, hallownest]
  "Hollow Knight: Silksong": [silksong]
  "Teenage Mutant Ninja Turtles: Shredder's Revenge": [tmnt shredders revenge, shredder's revenge]
  Ori and the Will of the Wisps: [ori wotw]
  Super Mario Bros Wonder: [mario wonder]
  Bloodstained Ritual of the Night: [ritual of the night]
  Elden Ring: [shadow of the erdtree]

# Titles that are ordinary English words: only accepted when the YouTube title STARTS with them.
ambiguous_titles: [Inside, Limbo, Braid, Grime, Gris, Islets, Unravel, Afterimage, Indivisible,
                   Sundered, Kunai, Constance, Mandragora, Contra, Jamestown, Biomorph, Noita]
