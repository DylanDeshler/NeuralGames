# 2D game whitelist / 3D blacklist used by 02_profile_and_sample.py
#
# Matching is done on a normalized form (lowercase, alphanumerics only), so
# "Hollow Knight: Silksong", "hollow_knight__silksong" and "HOLLOW KNIGHT SILKSONG" all match.
# NitroGen's `game` field is a snake_case slug and is "other" for a large share of videos; for
# those, the YouTube title/tags are matched against these titles (see --enrich-youtube).
#
# Precedence: config/game_labels.csv (manual)  >  exclude_3d  >  games_2d  >  YouTube match  >  keywords
# Extend freely. Run stage 02 once; it writes data/reports/game_label_report.csv listing the
# unlabeled games with the most hours — label those in config/game_labels.csv and re-run.

